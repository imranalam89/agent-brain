<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Brain | Bookmap L2 DOM Heatmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f141c;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0b0f15; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
    canvas { display: block; image-rendering: pixelated; }
    .bookmap-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      background: #171f2b;
      color: #94a3b8;
      border-top: 2px solid transparent;
      border-right: 1px solid #1f2a3a;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .bookmap-tab:hover {
      background: #1c2635;
      color: #f1f5f9;
    }
    .bookmap-tab.active {
      background: #0f141c;
      color: #38bdf8;
      border-top: 2px solid #38bdf8;
      border-bottom: 1px solid #0f141c;
    }
    .toolbar-btn {
      padding: 4px 8px;
      background: #1a222e;
      border: 1px solid #283548;
      color: #94a3b8;
      border-radius: 4px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .toolbar-btn:hover {
      background: #243042;
      color: #ffffff;
      border-color: #3b4d66;
    }
    .toolbar-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">

  <!-- TOP BOOKMAP HEADER BAR -->
  <header class="h-10 bg-[#141b24] border-b border-[#202937] flex items-center justify-between px-3 shrink-0">
    <!-- LEFT: BRAND & TABS -->
    <div class="flex items-center h-full gap-2 overflow-x-auto no-scrollbar">
      <!-- Bookmap Logo Badge -->
      <div class="flex items-center gap-1.5 pr-2 border-r border-[#243040]">
        <div class="flex gap-0.5 items-end h-4 w-4">
          <span class="w-1 h-2 bg-sky-400 rounded-sm"></span>
          <span class="w-1 h-4 bg-amber-400 rounded-sm"></span>
          <span class="w-1 h-3 bg-rose-500 rounded-sm"></span>
        </div>
        <span class="font-black text-xs tracking-wider text-slate-100 uppercase">BOOKMAP</span>
        <span class="text-[9px] font-bold px-1.5 py-0.2 rounded bg-sky-950 text-sky-400 border border-sky-800">L2 DOM</span>
      </div>

      <!-- Ticker Tabs -->
      <div class="flex items-center h-full" id="symbolTabs">
        <div onclick="switchSymbol('BTCUSD')" class="bookmap-tab active" data-sym="BTCUSD">
          <span>BTCUSD</span>
          <span class="text-[10px] text-slate-500 hover:text-slate-300">×</span>
        </div>
        <div onclick="switchSymbol('ETHUSD')" class="bookmap-tab" data-sym="ETHUSD">
          <span>ETHUSD</span>
          <span class="text-[10px] text-slate-500 hover:text-slate-300">×</span>
        </div>
        <div onclick="switchSymbol('XAUTUSD')" class="bookmap-tab" data-sym="XAUTUSD">
          <span>GOLD (XAUT)</span>
          <span class="text-[10px] text-slate-500 hover:text-slate-300">×</span>
        </div>
        <div onclick="switchSymbol('SLVONUSD')" class="bookmap-tab" data-sym="SLVONUSD">
          <span>SILVER</span>
          <span class="text-[10px] text-slate-500 hover:text-slate-300">×</span>
        </div>
        <div onclick="switchSymbol('PAXGUSD')" class="bookmap-tab" data-sym="PAXGUSD">
          <span>PAXG</span>
          <span class="text-[10px] text-slate-500 hover:text-slate-300">×</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: QUICK NAVIGATION -->
    <div class="flex items-center gap-2">
      <a href="live_journal.html" class="px-2.5 py-1 rounded bg-emerald-950 hover:bg-emerald-900 text-emerald-400 border border-emerald-800/80 text-[11px] font-bold font-mono transition flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Cockpit</span>
      </a>
      <a href="dom_master_analytics_report.html" class="px-2 py-1 rounded bg-[#1c2635] hover:bg-[#253246] text-slate-300 hover:text-white border border-[#2d3d52] text-[11px] font-mono transition">
        Analytics
      </a>
    </div>
  </header>

  <!-- SECONDARY TOOLBAR: CONTROLS & COLORMAP SLIDER -->
  <div class="h-9 bg-[#111720] border-b border-[#1c2533] px-3 flex items-center justify-between shrink-0 text-xs text-slate-400 font-mono">
    <div class="flex items-center gap-3">
      <!-- Timeframe / Snapshots Selector -->
      <div class="flex items-center gap-1">
        <span class="text-[10px] text-slate-500 uppercase font-bold">Span:</span>
        <select id="historyLimit" onchange="fetchHeatmap()" class="bg-[#18212e] border border-[#2b394e] rounded px-2 py-0.5 text-xs text-slate-200 focus:outline-none">
          <option value="60">60s (~1m)</option>
          <option value="120" selected>120s (~2m)</option>
          <option value="300">300s (~5m)</option>
          <option value="600">600s (~10m)</option>
          <option value="1200">1200s (~20m)</option>
        </select>
      </div>

      <div class="h-3 w-px bg-slate-800"></div>

      <!-- Color Palette Gradient Preview & Contrast -->
      <div class="flex items-center gap-2" title="Heatmap Intensity & Contrast">
        <span class="text-[10px] text-slate-500 uppercase font-bold">Heatmap:</span>
        <div class="w-24 h-2.5 rounded-sm bg-gradient-to-r from-[#0d346c] via-[#00b4d8] via-[#ffd600] to-[#ff3d00] border border-slate-700"></div>
        <input type="range" id="contrastSlider" min="0.2" max="0.8" step="0.05" value="0.45" oninput="renderCachedHeatmap()" class="w-16 accent-sky-400 cursor-pointer" title="Adjust Intensity">
      </div>

      <div class="h-3 w-px bg-slate-800"></div>

      <!-- Toggle Volume Bubbles -->
      <label class="flex items-center gap-1.5 cursor-pointer text-[11px] text-slate-300">
        <input type="checkbox" id="toggleBubbles" checked onchange="renderCachedHeatmap()" class="accent-sky-400 rounded">
        <span>Trade Bubbles</span>
      </label>

      <!-- Toggle Volume Subchart -->
      <label class="flex items-center gap-1.5 cursor-pointer text-[11px] text-slate-300">
        <input type="checkbox" id="toggleVolume" checked onchange="handleResize()" class="accent-sky-400 rounded">
        <span>Volume Delta</span>
      </label>
    </div>

    <!-- RIGHT: ZOOM & LIVE STATUS -->
    <div class="flex items-center gap-2">
      <!-- Zoom In/Out/Reset -->
      <button onclick="zoomIn()" class="toolbar-btn" title="Zoom In Price Axis">+</button>
      <button onclick="zoomOut()" class="toolbar-btn" title="Zoom Out Price Axis">−</button>
      <button onclick="resetZoom()" class="toolbar-btn" title="Reset Zoom">Fit</button>

      <div class="h-3 w-px bg-slate-800 mx-1"></div>

      <!-- Live Stream Pill -->
      <button id="toggleAutoBtn" onclick="toggleAutoRefresh()" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/80 font-bold text-[10px]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span>LIVE (1s)</span>
      </button>

      <!-- Reload button -->
      <button onclick="fetchHeatmap()" class="toolbar-btn text-[10px]" title="Manual Reload">
        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
      </button>
    </div>
  </div>

  <!-- MAIN BOOKMAP VIEWPORT: CANVAS + COB LADDER + VOLUME SUBCHART -->
  <main class="relative flex-1 w-full flex overflow-hidden bg-[#0e131b]">
    <!-- LEFT: MAIN HEATMAP CANVAS -->
    <div id="chartContainer" class="relative flex-1 h-full overflow-hidden cursor-crosshair">
      <canvas id="heatmapCanvas"></canvas>

      <!-- FLOATING CROSSHAIR TOOLTIP -->
      <div id="tooltip" class="absolute hidden pointer-events-none bg-[#121924]/95 border border-sky-500/40 rounded px-2.5 py-1.5 text-[11px] font-mono text-slate-200 shadow-2xl backdrop-blur z-30 space-y-0.5">
        <div id="ttTime" class="text-[10px] text-slate-400">--</div>
        <div class="flex justify-between gap-3 font-bold"><span class="text-slate-400">Price:</span><span id="ttPrice" class="text-white">--</span></div>
        <div class="flex justify-between gap-3"><span class="text-slate-400">Size:</span><span id="ttSize" class="text-sky-300 font-bold">--</span></div>
        <div class="flex justify-between gap-3"><span class="text-slate-400">Side:</span><span id="ttSide" class="text-slate-300 font-bold">--</span></div>
      </div>

      <!-- NO DATA OVERLAY -->
      <div id="noDataBanner" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0e131b]/90 hidden z-20">
        <div class="text-slate-300 font-mono text-sm font-bold flex items-center gap-2">
          <i data-lucide="loader" class="w-4 h-4 animate-spin text-sky-400"></i>
          Connecting to 24/7 DOM Orderbook Stream...
        </div>
        <div class="text-xs text-slate-500 mt-1 font-mono">Recorded snapshots will stream automatically.</div>
      </div>
    </div>

    <!-- RIGHT: COB (CURRENT ORDER BOOK) DEPTH LADDER & METRICS -->
    <div class="w-48 bg-[#111721] border-l border-[#1c2635] flex flex-col shrink-0">
      <!-- COB Header -->
      <div class="h-8 bg-[#141b26] border-b border-[#1e2938] px-2.5 flex items-center justify-between shrink-0">
        <span class="text-[10px] font-black uppercase tracking-wider text-slate-400 font-mono">COB DEPTH</span>
        <span id="cobSpread" class="text-[10px] font-mono text-amber-400 font-bold">--</span>
      </div>

      <!-- COB Canvas (Current orderbook horizontal depth bars) -->
      <div class="relative flex-1 overflow-hidden" id="cobContainer">
        <canvas id="cobCanvas"></canvas>
      </div>

      <!-- MINI STATS FOOTER -->
      <div class="bg-[#141b26] border-t border-[#1e2938] p-2 space-y-1 font-mono text-[10px] shrink-0">
        <div class="flex justify-between text-slate-400">
          <span>Imbalance:</span>
          <span id="mRatio" class="font-bold text-emerald-400">--</span>
        </div>
        <div class="flex justify-between text-slate-400">
          <span>Bid Liquidity:</span>
          <span id="mBids" class="font-bold text-sky-400">--</span>
        </div>
        <div class="flex justify-between text-slate-400">
          <span>Ask Liquidity:</span>
          <span id="mAsks" class="font-bold text-rose-400">--</span>
        </div>
        <div class="flex justify-between text-slate-400">
          <span>Snapshots:</span>
          <span id="mCount" class="font-bold text-amber-400">0</span>
        </div>
      </div>
    </div>
  </main>

  <!-- JAVASCRIPT RENDERING ENGINE -->
  <script>
    let currentSymbol = "BTCUSD";
    let autoRefreshTimer = null;
    let isAutoRefreshing = true;
    let cachedHeatmapData = null;
    let zoomLevel = 1.0;
    let priceCenterOffset = 0.0;
    let isDragging = false;
    let dragStartY = 0;
    let dragStartOffset = 0;

    // Canvas references
    const canvas = document.getElementById("heatmapCanvas");
    const ctx = canvas.getContext("2d");
    const cobCanvas = document.getElementById("cobCanvas");
    const cobCtx = cobCanvas.getContext("2d");
    const tooltip = document.getElementById("tooltip");

    function switchSymbol(sym) {
      currentSymbol = sym;
      zoomLevel = 1.0;
      priceCenterOffset = 0.0;
      document.querySelectorAll('#symbolTabs div').forEach(tab => {
        if (tab.getAttribute('data-sym') === sym) {
          tab.className = 'bookmap-tab active';
        } else {
          tab.className = 'bookmap-tab';
        }
      });
      fetchHeatmap();
    }

    function toggleAutoRefresh() {
      isAutoRefreshing = !isAutoRefreshing;
      const btn = document.getElementById("toggleAutoBtn");
      if (isAutoRefreshing) {
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span><span>LIVE (1s)</span>`;
        btn.className = "flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/80 font-bold text-[10px]";
        startAutoRefresh();
      } else {
        btn.innerHTML = `<span>PAUSED</span>`;
        btn.className = "flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-bold text-[10px]";
        clearInterval(autoRefreshTimer);
      }
    }

    function startAutoRefresh() {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(fetchHeatmap, 1000);
    }

    async function fetchHeatmap() {
      const limit = document.getElementById("historyLimit").value || 120;
      try {
        const res = await fetch(`/api/dom/heatmap?symbol=${encodeURIComponent(currentSymbol)}&limit=${limit}`);
        const json = await res.json();
        if (json.success && json.data) {
          cachedHeatmapData = json.data;
          renderHeatmap(json.data);
          renderCOB(json.data);
          updateMetrics(json.data);
        }
      } catch (err) {
        console.error("DOM heatmap fetch error:", err);
      }
    }

    function renderCachedHeatmap() {
      if (cachedHeatmapData) {
        renderHeatmap(cachedHeatmapData);
        renderCOB(cachedHeatmapData);
      }
    }

    function updateMetrics(data) {
      const count = data.count || 0;
      document.getElementById("mCount").textContent = count;
      if (count === 0) {
        document.getElementById("noDataBanner").classList.remove("hidden");
        return;
      }
      document.getElementById("noDataBanner").classList.add("hidden");

      const latest = data.levels[data.levels.length - 1];
      const spread = latest.spread || 0.0;
      document.getElementById("cobSpread").textContent = "Spread $" + spread.toFixed(2);
      document.getElementById("mRatio").textContent = (latest.imbalance_ratio || 1.0).toFixed(2) + "x";
      document.getElementById("mBids").textContent = (latest.total_bid_size || 0).toLocaleString();
      document.getElementById("mAsks").textContent = (latest.total_ask_size || 0).toLocaleString();
    }

    /* BOOKMAP COLORMAP PALETTE (Matches Bookmap reference image exactly) */
    function getBookmapColor(volume, maxVol, contrast) {
      if (volume <= 0 || !maxVol) return "transparent";
      const ratio = Math.min(1.0, Math.pow(volume / maxVol, contrast));

      if (ratio < 0.20) {
        // Deep Navy / Midnight Blue (Quiet limit orders)
        const t = ratio / 0.20;
        return `rgba(13, 52, 108, ${0.4 + t * 0.4})`;
      } else if (ratio < 0.45) {
        // Cyan / Sky Blue (Active liquidity)
        const t = (ratio - 0.20) / 0.25;
        const r = Math.round(0 + t * 0);
        const g = Math.round(180 + t * 45);
        const b = Math.round(216 + t * 39);
        return `rgba(${r}, ${g}, ${b}, 0.95)`;
      } else if (ratio < 0.75) {
        // Bright Orange / Amber (Dense liquidity wall)
        const t = (ratio - 0.45) / 0.30;
        const r = 255;
        const g = Math.round(214 - t * 80); // 214 -> 134
        const b = 0;
        return `rgba(${r}, ${g}, ${b}, 1.0)`;
      } else {
        // Intense Crimson Red (Whale Iceberg Wall)
        const t = (ratio - 0.75) / 0.25;
        const r = 255;
        const g = Math.round(80 - t * 60); // 80 -> 20
        const b = Math.round(30 - t * 20);
        return `rgba(${r}, ${g}, ${b}, 1.0)`;
      }
    }

    /* MAIN HEATMAP RENDERING ROUTINE */
    let gMinPrice = 0;
    let gMaxPrice = 0;
    let gPriceRange = 1;
    let gChartTop = 15;
    let gChartH = 400;
    let gChartW = 800;
    let gColWidth = 10;
    let gSnapshots = [];

    function renderHeatmap(data) {
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      // Clean dark Bookmap background
      ctx.fillStyle = "#0f141c";
      ctx.fillRect(0, 0, width, height);

      const snapshots = data.levels || [];
      gSnapshots = snapshots;
      if (snapshots.length === 0) return;

      const showVolume = document.getElementById("toggleVolume").checked;
      const volumeBarHeight = showVolume ? 60 : 0;
      const paddingLeft = 5;
      const paddingRight = 65; // Price label margin
      const paddingTop = 15;
      const paddingBottom = 26 + volumeBarHeight;

      const chartW = width - paddingLeft - paddingRight;
      const chartH = height - paddingTop - paddingBottom;
      gChartTop = paddingTop;
      gChartH = chartH;
      gChartW = chartW;

      // Calculate price domain & max size
      let minPrice = Infinity;
      let maxPrice = -Infinity;
      let maxSize = 1;

      snapshots.forEach(s => {
        (s.bids || []).forEach(b => {
          minPrice = Math.min(minPrice, b[0]);
          maxPrice = Math.max(maxPrice, b[0]);
          maxSize = Math.max(maxSize, b[1]);
        });
        (s.asks || []).forEach(a => {
          minPrice = Math.min(minPrice, a[0]);
          maxPrice = Math.max(maxPrice, a[0]);
          maxSize = Math.max(maxSize, a[1]);
        });
      });

      if (minPrice === Infinity || maxPrice === -Infinity) return;

      // Apply zoom & vertical pan offset
      const rawSpan = maxPrice - minPrice || 10.0;
      const pad = rawSpan * 0.05;
      minPrice -= pad;
      maxPrice += pad;

      const currentMid = (snapshots[snapshots.length - 1].mid_price || (minPrice + maxPrice) / 2);
      const span = (maxPrice - minPrice) / zoomLevel;
      const center = currentMid + priceCenterOffset;
      minPrice = center - (span / 2);
      maxPrice = center + (span / 2);
      const priceRange = maxPrice - minPrice;

      gMinPrice = minPrice;
      gMaxPrice = maxPrice;
      gPriceRange = priceRange;

      const numCols = snapshots.length;
      const colWidth = Math.max(3, chartW / numCols);
      gColWidth = colWidth;
      const contrast = parseFloat(document.getElementById("contrastSlider").value) || 0.45;
      const showBubbles = document.getElementById("toggleBubbles").checked;

      // 1. DOTTED HORIZONTAL PRICE GRID & RIGHT-AXIS LABELS
      const numPriceSteps = 9;
      for (let i = 0; i <= numPriceSteps; i++) {
        const p = minPrice + (priceRange * (i / numPriceSteps));
        const y = paddingTop + chartH - ((p - minPrice) / priceRange * chartH);

        // Price gridline
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.setLineDash([2, 4]);
        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(width - paddingRight, y);
        ctx.stroke();

        // Price axis text
        ctx.fillStyle = "#64748b";
        ctx.font = "10px ui-monospace, SFMono-Regular, monospace";
        ctx.fillText(p.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1}), width - paddingRight + 6, y + 3.5);
      }
      ctx.setLineDash([]);

      // 2. DOTTED VERTICAL TIME GRID & TIMESTAMPS
      const timeInterval = Math.max(1, Math.floor(numCols / 6));
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.setLineDash([2, 4]);
      for (let i = 0; i < numCols; i += timeInterval) {
        const x = paddingLeft + (i * colWidth);
        ctx.beginPath();
        ctx.moveTo(x, paddingTop);
        ctx.lineTo(x, paddingTop + chartH);
        ctx.stroke();

        const timeStr = (snapshots[i].datetime_ist || "").split(" ")[1] || "";
        if (timeStr) {
          ctx.fillStyle = "#64748b";
          ctx.font = "9px ui-monospace, SFMono-Regular, monospace";
          ctx.fillText(timeStr, x - 18, paddingTop + chartH + 16);
        }
      }
      ctx.setLineDash([]);

      // 3. DRAW CONTINUOUS BOOKMAP HEATMAP LIQUIDITY BANDS
      // Estimate tick height dynamically from price range
      const tickHeight = Math.max(2.0, Math.min(8.0, chartH / 80));

      snapshots.forEach((s, colIdx) => {
        const x = paddingLeft + (colIdx * colWidth);

        // Bids Liquidity
        (s.bids || []).forEach(([price, size]) => {
          if (price < minPrice || price > maxPrice) return;
          const y = paddingTop + chartH - ((price - minPrice) / priceRange * chartH);
          ctx.fillStyle = getBookmapColor(size, maxSize, contrast);
          ctx.fillRect(x, y - (tickHeight / 2), colWidth + 0.6, tickHeight);
        });

        // Asks Liquidity
        (s.asks || []).forEach(([price, size]) => {
          if (price < minPrice || price > maxPrice) return;
          const y = paddingTop + chartH - ((price - minPrice) / priceRange * chartH);
          ctx.fillStyle = getBookmapColor(size, maxSize, contrast);
          ctx.fillRect(x, y - (tickHeight / 2), colWidth + 0.6, tickHeight);
        });
      });

      // 4. DRAW CRISP STEP-LINE FOR TRADED / MID PRICE (Bookmap White Line)
      ctx.beginPath();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8;
      ctx.shadowColor = "rgba(255, 255, 255, 0.4)";
      ctx.shadowBlur = 3;

      snapshots.forEach((s, colIdx) => {
        const x = paddingLeft + (colIdx * colWidth);
        const y = paddingTop + chartH - ((s.mid_price - minPrice) / priceRange * chartH);

        if (colIdx === 0) {
          ctx.moveTo(x, y);
        } else {
          const prevY = paddingTop + chartH - ((snapshots[colIdx - 1].mid_price - minPrice) / priceRange * chartH);
          ctx.lineTo(x, prevY);
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      ctx.shadowBlur = 0; // reset glow

      // 5. DRAW 3D TRADE AGGRESSION BUBBLES (Spherical volume bubbles on price)
      if (showBubbles) {
        for (let i = 1; i < snapshots.length; i++) {
          const s = snapshots[i];
          const prev = snapshots[i - 1];
          const x = paddingLeft + (i * colWidth);
          const y = paddingTop + chartH - ((s.mid_price - minPrice) / priceRange * chartH);

          const priceDiff = s.mid_price - prev.mid_price;
          const isBuyer = priceDiff > 0 || (priceDiff === 0 && s.dominant_side === "BUYERS");
          const isSeller = priceDiff < 0 || (priceDiff === 0 && s.dominant_side === "SELLERS");

          if (!isBuyer && !isSeller) continue;

          const imbalance = Math.max(1.0, isBuyer ? (s.imbalance_ratio || 1.0) : (1.0 / (s.imbalance_ratio || 1.0)));
          const radius = Math.min(14, Math.max(4.0, 3.5 + Math.sqrt(imbalance) * 2.8));

          // 3D Spherical Radial Gradient Highlight (Glossy Bookmap Look)
          const grad = ctx.createRadialGradient(
            x - radius * 0.35, y - radius * 0.35, radius * 0.1,
            x, y, radius
          );

          if (isBuyer) {
            grad.addColorStop(0, "#a7f3d0"); // Crisp highlight
            grad.addColorStop(0.65, "#10b981"); // Vibrant emerald
            grad.addColorStop(1, "#047857"); // Dark green rim
          } else {
            grad.addColorStop(0, "#fecaca"); // Crisp highlight
            grad.addColorStop(0.65, "#ef4444"); // Vibrant red
            grad.addColorStop(1, "#b91c1c"); // Dark red rim
          }

          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      // 6. DRAW BOTTOM VOLUME / CVD DELTA HISTOGRAM
      if (showVolume) {
        const volTop = paddingTop + chartH + 24;
        const volH = volumeBarHeight - 10;

        // Subchart baseline
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.beginPath();
        ctx.moveTo(paddingLeft, volTop);
        ctx.lineTo(width - paddingRight, volTop);
        ctx.stroke();

        ctx.fillStyle = "#475569";
        ctx.font = "8px ui-monospace, SFMono-Regular, monospace";
        ctx.fillText("VOL DELTA", paddingLeft + 4, volTop + 10);

        let maxVolDelta = 1;
        snapshots.forEach(s => {
          const delta = Math.abs((s.total_bid_size || 0) - (s.total_ask_size || 0));
          maxVolDelta = Math.max(maxVolDelta, delta);
        });

        snapshots.forEach((s, colIdx) => {
          const x = paddingLeft + (colIdx * colWidth);
          const bidSz = s.total_bid_size || 0;
          const askSz = s.total_ask_size || 0;
          const delta = bidSz - askSz;
          const barH = Math.max(2, (Math.abs(delta) / maxVolDelta) * volH);
          const isBull = delta >= 0;

          ctx.fillStyle = isBull ? "rgba(34, 197, 94, 0.6)" : "rgba(239, 68, 68, 0.6)";
          ctx.fillRect(x, volTop + volH - barH, colWidth - 0.5, barH);
        });
      }

      // 7. RIGHT AXIS CURRENT PRICE BADGE (Bookmap red/white tag)
      const latestMid = snapshots[snapshots.length - 1].mid_price;
      const latestY = paddingTop + chartH - ((latestMid - minPrice) / priceRange * chartH);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(width - paddingRight, latestY - 9, paddingRight - 4, 18);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px ui-monospace, SFMono-Regular, monospace";
      ctx.fillText(latestMid.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1}), width - paddingRight + 5, latestY + 3.5);
    }

    /* RIGHT-SIDE COB (CURRENT ORDER BOOK) DEPTH LADDER */
    function renderCOB(data) {
      const dpr = window.devicePixelRatio || 1;
      const width = cobCanvas.parentElement.clientWidth;
      const height = cobCanvas.parentElement.clientHeight;

      cobCanvas.width = width * dpr;
      cobCanvas.height = height * dpr;
      cobCtx.scale(dpr, dpr);

      cobCtx.fillStyle = "#111721";
      cobCtx.fillRect(0, 0, width, height);

      const snapshots = data.levels || [];
      if (snapshots.length === 0 || gPriceRange <= 0) return;

      const latest = snapshots[snapshots.length - 1];
      const bids = latest.bids || [];
      const asks = latest.asks || [];

      // Find max size among current order book for scale
      let maxCobSize = 1;
      bids.forEach(b => maxCobSize = Math.max(maxCobSize, b[1]));
      asks.forEach(a => maxCobSize = Math.max(maxCobSize, a[1]));

      const barMaxW = width - 58; // reserve 58px for price label
      const tickH = Math.max(2.5, Math.min(8.0, gChartH / 80));

      // Draw Asks (Red horizontal bars above mid price)
      asks.forEach(([price, size]) => {
        if (price < gMinPrice || price > gMaxPrice) return;
        const y = gChartTop + gChartH - ((price - gMinPrice) / gPriceRange * gChartH);
        const barW = Math.max(2, (size / maxCobSize) * barMaxW);

        cobCtx.fillStyle = "rgba(239, 68, 68, 0.75)";
        cobCtx.fillRect(0, y - (tickH / 2), barW, tickH);

        // Order size text
        if (tickH >= 5 || barW > 20) {
          cobCtx.fillStyle = "#fca5a5";
          cobCtx.font = "8px ui-monospace, SFMono-Regular, monospace";
          cobCtx.fillText(size > 999 ? (size/1000).toFixed(1) + "k" : size, barW + 3, y + 2.5);
        }
      });

      // Draw Bids (Green horizontal bars below mid price)
      bids.forEach(([price, size]) => {
        if (price < gMinPrice || price > gMaxPrice) return;
        const y = gChartTop + gChartH - ((price - gMinPrice) / gPriceRange * gChartH);
        const barW = Math.max(2, (size / maxCobSize) * barMaxW);

        cobCtx.fillStyle = "rgba(34, 197, 94, 0.75)";
        cobCtx.fillRect(0, y - (tickH / 2), barW, tickH);

        // Order size text
        if (tickH >= 5 || barW > 20) {
          cobCtx.fillStyle = "#86efac";
          cobCtx.font = "8px ui-monospace, SFMono-Regular, monospace";
          cobCtx.fillText(size > 999 ? (size/1000).toFixed(1) + "k" : size, barW + 3, y + 2.5);
        }
      });

      // Highlight Current Price Line in COB
      const latestMid = latest.mid_price;
      const midY = gChartTop + gChartH - ((latestMid - gMinPrice) / gPriceRange * gChartH);
      cobCtx.strokeStyle = "#ffffff";
      cobCtx.lineWidth = 1;
      cobCtx.beginPath();
      cobCtx.moveTo(0, midY);
      cobCtx.lineTo(width, midY);
      cobCtx.stroke();
    }

    /* INTERACTIVE ZOOM & PAN CONTROLS */
    function zoomIn() {
      zoomLevel = Math.min(8.0, zoomLevel * 1.25);
      renderCachedHeatmap();
    }

    function zoomOut() {
      zoomLevel = Math.max(0.4, zoomLevel * 0.8);
      renderCachedHeatmap();
    }

    function resetZoom() {
      zoomLevel = 1.0;
      priceCenterOffset = 0.0;
      renderCachedHeatmap();
    }

    // Mouse wheel zoom on price axis
    const chartContainer = document.getElementById("chartContainer");
    chartContainer.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.deltaY < 0) {
        zoomLevel = Math.min(8.0, zoomLevel * 1.12);
      } else {
        zoomLevel = Math.max(0.4, zoomLevel * 0.88);
      }
      renderCachedHeatmap();
    }, { passive: false });

    // Drag to Pan vertically
    chartContainer.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragStartY = e.clientY;
      dragStartOffset = priceCenterOffset;
    });

    window.addEventListener("mousemove", (e) => {
      if (isDragging && gPriceRange) {
        const deltaY = e.clientY - dragStartY;
        const pricePerPx = gPriceRange / gChartH;
        priceCenterOffset = dragStartOffset + (deltaY * pricePerPx);
        renderCachedHeatmap();
      }

      // Update Hover Tooltip
      if (!isDragging && gSnapshots.length > 0) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (mouseX >= 5 && mouseX <= gChartW && mouseY >= gChartTop && mouseY <= gChartTop + gChartH) {
          const colIdx = Math.floor((mouseX - 5) / gColWidth);
          if (colIdx >= 0 && colIdx < gSnapshots.length) {
            const s = gSnapshots[colIdx];
            const hoveredPrice = gMaxPrice - ((mouseY - gChartTop) / gChartH * gPriceRange);

            tooltip.style.left = (e.clientX + 14) + "px";
            tooltip.style.top = (e.clientY - 10) + "px";
            tooltip.classList.remove("hidden");

            document.getElementById("ttTime").textContent = s.datetime_ist || "";
            document.getElementById("ttPrice").textContent = "$" + hoveredPrice.toFixed(2);
            document.getElementById("ttSize").textContent = "$" + (s.mid_price || 0).toFixed(2) + " (Mid)";
            document.getElementById("ttSide").textContent = s.dominant_side || "NEUTRAL";
            return;
          }
        }
      }
      tooltip.classList.add("hidden");
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    function handleResize() {
      renderCachedHeatmap();
    }
    window.addEventListener("resize", handleResize);

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
      fetchHeatmap();
      startAutoRefresh();
    });
  </script>
</body>
